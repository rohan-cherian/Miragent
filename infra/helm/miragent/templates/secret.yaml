{{- if empty .Values.secrets.scoutApiKey }}
# WARNING: secrets.scoutApiKey is not set. The Scout API will be inaccessible until
# you populate this value. Set it via:
#   helm upgrade --set secrets.scoutApiKey=<your-key> ...
# or via a Kubernetes Secret reference in your values override file.
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "miragent.fullname" . }}-secrets
  labels:
    {{- include "miragent.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  SCOUT_API_KEY: {{ .Values.secrets.scoutApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  NEO4J_PASSWORD: {{ .Values.secrets.neo4jPassword | default "CHANGE_ME" | quote }}
