apiVersion: v1
kind: Service
metadata:
  name: {{ include "miragent.fullname" . }}-api
  labels:
    {{- include "miragent.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: 8000
      protocol: TCP
  selector:
    {{- include "miragent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
